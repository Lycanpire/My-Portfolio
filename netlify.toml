[build]
  command = "npm run clean && npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20.19.2"
  NPM_VERSION = "10.8.2"
  GATSBY_CPU_COUNT = "1"
  NODE_ENV = "production"

[[plugins]]
  package = "@netlify/plugin-gatsby"

[[plugins]]
  package = "@netlify/plugin-lighthouse" 