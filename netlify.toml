[build]
  command = "mise settings add idiomatic_version_file_enable_tools node && nvm use && npm run clean && npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20.19.2"
  NPM_VERSION = "10.8.2"
  NODE_ENV = "production"
  GATSBY_CPU_COUNT = "1"

[[plugins]]
  package = "@netlify/plugin-gatsby"